apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: transport24h
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: ghcr.io/oualid-coder/t24h-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Appels serveur (proxy, login, dashboard) vers la gateway par le réseau interne,
            # sans repasser par l'ingress public qui écraserait X-Real-IP (IP du visiteur).
            # Lu au runtime, jamais exposé au navigateur (pas de préfixe NEXT_PUBLIC_).
            - name: API_URL
              value: "http://gateway.transport24h.svc.cluster.local:8080"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
